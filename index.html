<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
:root{--bg:#0a0d12;--panel:rgba(15,20,28,.58);--text:#f4f7fb;--muted:rgba(244,247,251,.62);--border:rgba(255,255,255,.09);--accent:#9ecbff;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c10;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Hiragino Sans",Meiryo,sans-serif}
body{min-height:100vh;background-size:cover;background-position:center;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,12,.28),rgba(5,8,12,.68));pointer-events:none;z-index:-1}
button,input{font:inherit}button{color:inherit;cursor:pointer}
.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 46px}
.top{display:flex;justify-content:space-between;align-items:center}.weather{color:var(--muted);font-size:14px}
.icon,.btn{border:1px solid var(--border);background:rgba(255,255,255,.055);border-radius:12px;padding:9px 11px;color:inherit}.icon{width:42px;height:42px}
.hero{text-align:center;padding:34px 0 26px}.date{color:var(--muted);font-size:13px;letter-spacing:.15em}.clock{font-size:clamp(72px,13vw,150px);font-weight:200;letter-spacing:-.055em;font-variant-numeric:tabular-nums;line-height:.95;margin-top:10px}
.searchw{max-width:720px;margin:28px auto 0}.search{width:100%;height:58px;border-radius:17px;border:1px solid var(--border);background:rgba(255,255,255,.07);color:white;outline:0;padding:0 18px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:18px;margin-top:28px;align-items:start}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(20px);box-shadow:0 18px 60px rgba(0,0,0,.28)}
.links{padding:22px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h2{font-size:14px;margin:0}.title span{font-size:11px;color:var(--muted)}
.cat+ .cat{margin-top:22px}.catlabel{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.link{min-height:48px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.045);color:white;text-decoration:none;display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:.2s ease}.link:hover{background:rgba(255,255,255,.085);transform:translateY(-1px)}.link.highlighted{background:color-mix(in srgb,var(--hl) 18%,rgba(255,255,255,.045));border-color:color-mix(in srgb,var(--hl) 48%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--hl) 12%,transparent) inset,0 10px 28px color-mix(in srgb,var(--hl) 14%,transparent)}.link.highlighted .dot{background:var(--hl);box-shadow:0 0 14px color-mix(in srgb,var(--hl) 65%,transparent)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.side{display:grid;gap:18px}.timer{padding:22px}.display{text-align:center;font-size:58px;font-variant-numeric:tabular-nums;margin:22px 0 18px}.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}.actions{display:flex;gap:9px;margin-top:10px}.actions button{flex:1}.status{text-align:center;min-height:18px;font-size:11px;color:var(--muted);margin-top:10px}
.wake{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.wake strong{display:block;font-size:13px}.wake span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.wakebtn.active{background:rgba(158,203,255,.16);border-color:rgba(158,203,255,.42)}
.secret-export{
  position:fixed;
  right:10px;
  bottom:10px;
  width:26px;
  height:26px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(10,13,18,.22);
  color:rgba(255,255,255,.18);
  border-radius:9px;
  display:grid;
  place-items:center;
  font-size:11px;
  opacity:.28;
  transition:.2s ease;
  z-index:50;
  backdrop-filter:blur(8px);
}
.secret-export:hover,
.secret-export:focus{
  opacity:.95;
  color:rgba(255,255,255,.85);
  border-color:rgba(255,255,255,.18);
  background:rgba(20,26,34,.72);
}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .app{width:min(100% - 22px,720px)}
  .secret-export{right:7px;bottom:7px;width:24px;height:24px}
}
</style>
</head>
<body>
<main class="app">
<div class="top"><div id="weather" class="weather">Weather...</div><button id="bg" class="icon" title="Change background">↻</button></div>
<section class="hero"><div id="date" class="date"></div><div id="clock" class="clock">00:00</div><form id="searchForm" class="searchw"><input id="search" class="search" placeholder="Search the web..." autocomplete="off"></form></section>
<section class="layout">
<div class="card links"><div class="title"><h2>Shortcuts</h2><span id="count"></span></div><div id="links"></div></div>
<div class="side">
<section class="card timer"><div class="title"><h2>Timer</h2><span>Simple focus timer</span></div><div id="tdisplay" class="display">05:00</div><div id="presets" class="presets"></div><div class="actions"><button id="start" class="btn">Start</button><button id="reset" class="btn">Reset</button></div><div id="status" class="status"></div></section>
<section class="card wake"><div><strong>Keep Screen Awake</strong><span>Prevent automatic screen sleep when supported.</span></div><button id="wake" class="btn wakebtn">OFF</button></section>
</div>
</section>
</main>

<button id="secretExport" class="secret-export" type="button" title="Export index.html" aria-label="Export index.html">↓</button>

<script>
const CONFIG={"clock":{"locale":"en-US","showSeconds":false,"hour12":false},"weather":{"label":"Tokyo","latitude":35.6598,"longitude":139.7024},"search":{"engine":"https://www.google.com/search?q="},"builder":{"outputFilename":"index.html"},"timer":{"presets":[5,10,15,30],"allowCustom":true,"playSound":true,"wakeWithTimer":true},"theme":{"accent":"#9ecbff"},"backgrounds":["radial-gradient(circle at 20% 15%, #1e3550 0%, #101722 38%, #080b10 100%)","radial-gradient(circle at 78% 20%, #3a2548 0%, #17131f 35%, #090a0d 100%)","radial-gradient(circle at 50% 5%, #243d38 0%, #111d1b 35%, #080b0b 100%)","linear-gradient(135deg, #101827 0%, #11131b 45%, #07090d 100%)"],"linkGroups":[{"name":"Daily","links":[{"label":"ChatGPT","url":"https://chatgpt.com/","highlight":false,"highlightColor":"#ffff00","useAccentColor":true},{"label":"GitHub","url":"https://github.com/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Keep","url":"https://keep.google.com/","highlight":false,"highlightColor":"#ffff00","useAccentColor":false},{"label":"Drive","url":"https://drive.google.com/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"YouTube","url":"https://youtube.com/","highlight":true,"highlightColor":"#ff0000","useAccentColor":false},{"label":"Weather","url":"https://kentaro222.github.io/Today-Tomorrow-Weather/","highlight":true,"highlightColor":"#ffa600","useAccentColor":false},{"label":"翻訳","url":"https://translate.google.com/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Amazon","url":"https://www.amazon.co.jp/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false}]},{"name":"Tools","links":[{"label":"Time Tools","url":"https://kentaro222.github.io/Stage-Time-Toolkit/","highlight":true,"highlightColor":"#00ff00","useAccentColor":false},{"label":"Stage Tools","url":"https://kentaro222.github.io/Stage-Tools/","highlight":true,"highlightColor":"#00ff00","useAccentColor":false},{"label":"MP3ラウドネス調整","url":"https://kentaro222.github.io/Audio-Loudness-Normalizer/","highlight":true,"highlightColor":"#ff9ee0","useAccentColor":false},{"label":"QR Code","url":"https://kentaro222.github.io/QR-Code-Generation-and-Saver/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Air fryer","url":"https://kentaro222.github.io/Air-fryer-conversion-tool","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"PIXEL TAROT","url":"https://kentaro222.github.io/PIXEL-TAROT/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"申送作成","url":"https://kentaro222.github.io/Handover-File-Creation-Tool/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false}]},{"name":"Games","links":[{"label":"PIXLE JUMP","url":"https://kentaro222.github.io/Pixel-Jump/","highlight":true,"highlightColor":"#ffffff","useAccentColor":false},{"label":"Synth-Zooo","url":"https://kentaro222.github.io/Synth-Zooo/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"BIG CHEESE","url":"https://kentaro222.github.io/The-Big-Cheese-Single-Player/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Suzume-jong","url":"https://kentaro222.github.io/4nin-uchi-Suzume-jong/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Retro VideoPoker","url":"https://kentaro222.github.io/Retro-VideoPoker/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"REGICIDE","url":"https://kentaro222.github.io/Regicide-Single-Player/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Derby Mice","url":"https://kentaro222.github.io/Derby-for-Mice/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"CHILL WALK","url":"https://kentaro222.github.io/CHILL-WALK-Synthwave/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Music Visualizer","url":"https://kentaro222.github.io/Pixel-Mascot-Music-Visualizer/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Ghost-Stairs","url":"https://kentaro222.github.io/Ghost-Stairs/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false}]},{"name":"Other","links":[{"label":"ダッシュボード","url":"https://kentaro222.github.io/My-Dashboard/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"DB更新","url":"https://github.com/kentaro222/My-Dashboard","highlight":true,"highlightColor":"#ff00ff","useAccentColor":false},{"label":"Home Page","url":"https://kentaro222.github.io/KENTARO-S-HOME-PAGE/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"Tate Novel Studio","url":"https://kentaro222.github.io/test01/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false},{"label":"スクリプトチェック","url":"https://kentaro222.github.io/test02/","highlight":false,"highlightColor":"#9ecbff","useAccentColor":false}]}]};

function exportCurrentDashboard(){
  try{
    const html="<!DOCTYPE html>
"+document.documentElement.outerHTML;
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    alert("index.html を出力できませんでした。");
  }
}

document.getElementById("secretExport").addEventListener("click",exportCurrentDashboard);

let bgIndex=-1;
function bg(){let n=bgIndex;while(CONFIG.backgrounds.length>1&&n===bgIndex)n=Math.floor(Math.random()*CONFIG.backgrounds.length);if(n<0)n=0;bgIndex=n;document.body.style.backgroundImage=CONFIG.backgrounds[n]}
bg();document.getElementById("bg").onclick=bg;
function clock(){const n=new Date();date.textContent=n.toLocaleDateString(CONFIG.clock.locale,{weekday:"long",month:"long",day:"numeric"}).toUpperCase();document.getElementById("clock").textContent=n.toLocaleTimeString(CONFIG.clock.locale,{hour:"2-digit",minute:"2-digit",second:CONFIG.clock.showSeconds?"2-digit":undefined,hour12:CONFIG.clock.hour12})}clock();setInterval(clock,1000);
function wicon(code){if(code===0)return"☀";if(code<=3)return"⛅";if(code<=48)return"🌫";if(code<=67)return"🌧";if(code<=77)return"❄";if(code<=82)return"🌦";return"⛈"}
fetch("https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.weather.latitude+"&longitude="+CONFIG.weather.longitude+"&current=temperature_2m,weather_code&timezone=auto").then(r=>r.json()).then(d=>weather.textContent=wicon(d.current.weather_code)+"  "+CONFIG.weather.label+"  "+Math.round(d.current.temperature_2m)+"°C").catch(()=>weather.textContent=CONFIG.weather.label+" · Weather unavailable");
searchForm.onsubmit=e=>{e.preventDefault();const q=search.value.trim();if(q)window.open(CONFIG.search.engine+encodeURIComponent(q),"_blank")};
let total=0;links.innerHTML=CONFIG.linkGroups.map(g=>{total+=g.links.length;return'<section class="cat"><div class="catlabel">'+g.name+'</div><div class="grid">'+g.links.map(x=>{const cls=x.highlight?"link highlighted":"link";const hl=x.useAccentColor?CONFIG.theme.accent:x.highlightColor;const style=x.highlight?' style="--hl:'+hl+'"':"";return'<a class="'+cls+'"'+style+' target="_blank" rel="noopener" href="'+x.url+'"><span class="dot"></span>'+x.label+'</a>'}).join("")+'</div></section>'}).join("");count.textContent=total+" links";
const presetRoot=document.getElementById("presets");
presetRoot.innerHTML=CONFIG.timer.presets.map(m=>'<button class="btn preset" data-m="'+m+'">'+m+' min</button>').join("")+(CONFIG.timer.allowCustom?'<button id="custom" class="btn">Custom</button>':"");
let def=(CONFIG.timer.presets[0]||5)*60,remain=def,running=false,int=null,target=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function draw(){tdisplay.textContent=fmt(remain);start.textContent=running?"Pause":"Start";document.title=running?fmt(remain)+" · Dashboard":"Dashboard"}
function stopi(){if(int)clearInterval(int);int=null;target=null}
function setm(m){stopi();def=Math.round(m*60);remain=def;running=false;status.textContent="";draw()}
function tick(){if(!running||!target)return;remain=Math.max(0,Math.ceil((target-Date.now())/1000));if(remain<=0){running=false;stopi();status.textContent="Time's up.";draw();if(CONFIG.timer.playSound)sound();if(CONFIG.timer.wakeWithTimer)releaseWake();return}draw()}
function begin(){if(remain<=0)remain=def;running=true;target=Date.now()+remain*1000;int=setInterval(tick,250);status.textContent="";draw();if(CONFIG.timer.wakeWithTimer)requestWake()}
function pause(){tick();running=false;stopi();draw()}
start.onclick=()=>running?pause():begin();reset.onclick=()=>{stopi();running=false;remain=def;status.textContent="";draw();if(CONFIG.timer.wakeWithTimer)releaseWake()};
document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>setm(Number(b.dataset.m)));
if(document.getElementById("custom"))custom.onclick=()=>{const v=prompt("Minutes","15");if(v===null)return;const m=Number(v);if(m>0&&m<=1440)setm(m)};
function sound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.15,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.7);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.75)}catch(e){}}
let lock=null,requested=false;function wakeDraw(){wake.classList.toggle("active",!!lock);wake.textContent=lock?"ON":"OFF"}
async function requestWake(){if(!("wakeLock" in navigator))return;try{lock=await navigator.wakeLock.request("screen");requested=true;wakeDraw();lock.addEventListener("release",()=>{lock=null;wakeDraw()})}catch(e){}}
async function releaseWake(){requested=false;if(lock){try{await lock.release()}catch(e){}}lock=null;wakeDraw()}
wake.onclick=()=>lock||requested?releaseWake():requestWake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&requested&&!lock)requestWake()});wakeDraw();draw();
</script>
</body>
</html>
